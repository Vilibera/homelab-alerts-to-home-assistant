# Alertmanager: send every alert to the Home Assistant webhook.
# Replace HOME_ASSISTANT and YOUR_WEBHOOK_ID.
route:
  receiver: home-assistant
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: home-assistant
    webhook_configs:
      - url: http://HOME_ASSISTANT:8123/api/webhook/YOUR_WEBHOOK_ID
        send_resolved: true
